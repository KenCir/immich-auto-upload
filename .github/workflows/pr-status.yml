name: Pull request status

on:
  pull_request_target:
    types: [opened, closed, reopened, synchronize, review_requested, review_request_removed, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: ['Pull Request Labeler']
    types: [completed]

permissions: {}

jobs:
  resolve-prs:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request_review' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    outputs:
      numbers: ${{ steps.resolve.outputs.numbers }}
    steps:
      - name: Resolve PRs from GitHub metadata only
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let numbers = [];
            if (context.eventName === 'pull_request_target') {
              numbers = [context.payload.pull_request.number];
            } else {
              // Never consume an artifact, checkout, script, or label decision
              // from the unprivileged notification run.
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: context.payload.workflow_run.id,
              });
              const { data: workflow } = await github.rest.actions.getWorkflow({
                ...context.repo, workflow_id: 'pr-labeler.yml',
              });
              if (run.workflow_id !== workflow.id ||
                  run.repository.full_name.toLowerCase() !==
                    `${context.repo.owner}/${context.repo.repo}`.toLowerCase() ||
                  run.path !== '.github/workflows/pr-labeler.yml' ||
                  run.event !== 'pull_request_review' ||
                  run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error('Unexpected review notification source');
              }
              numbers = (run.pull_requests || []).map(pr => pr.number);
              if (numbers.length === 0) {
                // Fork runs may have no associated pull_requests. Match the
                // source repository and branch through GitHub's API only.
                const open = await github.paginate(github.rest.pulls.list, {
                  ...context.repo, state: 'open', per_page: 100,
                });
                numbers = open.filter(pr =>
                  pr.head.repo?.id === run.head_repository?.id &&
                  pr.head.ref === run.head_branch).map(pr => pr.number);
              }
            }
            numbers = [...new Set(numbers)];
            if (numbers.some(number => !Number.isSafeInteger(number) || number <= 0)) {
              throw new Error('Invalid PR number from GitHub metadata');
            }
            core.setOutput('numbers', JSON.stringify(numbers));

  update-status:
    needs: resolve-prs
    if: needs.resolve-prs.outputs.numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.resolve-prs.outputs.numbers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    # Share the lock with the other PR label writer; keep both pending jobs.
    concurrency:
      group: pr-labels-${{ github.repository }}-${{ matrix.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Reconcile current PR status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ matrix.number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number <= 0) {
              throw new Error('Invalid PR number');
            }
            const labels = {
              inProgress: 'PR: In Progress',
              review: 'PR: Review',
              ready: 'PR: Ready',
              changesRequested: 'PR: Changes Requested',
              blocked: 'PR: Blocked',
              merged: 'PR: Merged',
            };
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: number,
            });
            const current = new Set(pr.labels.map(label =>
              typeof label === 'string' ? label : label.name));
            let next;
            if (pr.merged) next = labels.merged;
            else if (pr.state === 'closed') next = labels.blocked;
            else if (current.has(labels.blocked)) next = labels.blocked;
            else if (pr.draft) next = labels.inProgress;
            else {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                ...context.repo, pull_number: number, per_page: 100,
              });
              // A later COMMENTED/PENDING review does not revoke a decision.
              // DISMISSED does revoke it; keep the latest decision per user.
              const latest = new Map();
              for (const review of reviews.sort((a, b) => a.id - b.id)) {
                if (!review.user || !['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) continue;
                latest.set(review.user.id, review);
              }
              const decisions = [...latest.values()];
              const requested = await github.rest.pulls.listRequestedReviewers({
                ...context.repo, pull_number: number,
              });
              if (decisions.some(review => review.state === 'CHANGES_REQUESTED')) {
                next = labels.changesRequested;
              } else if (requested.data.users.length || requested.data.teams.length) {
                next = labels.review;
              } else if (decisions.some(review =>
                review.state === 'APPROVED' && review.commit_id === pr.head.sha)) {
                // Ready describes review state only, not CI or mergeability.
                next = labels.ready;
              } else next = labels.inProgress;
            }
            if (!current.has(next)) {
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: number, labels: [next],
              });
            }
            for (const name of Object.values(labels)) {
              if (name === next || !current.has(name)) continue;
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: number, name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
