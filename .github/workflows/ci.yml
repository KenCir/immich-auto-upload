name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Windows Release build and tests
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The repository targets .NET 10 and currently has no global.json.
          dotnet-version: ${{ hashFiles('global.json') == '' && '10.0.x' || '' }}
          global-json-file: ${{ hashFiles('global.json') != '' && 'global.json' || '' }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', 'global.json', '.github/workflows/ci.yml') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore
        run: dotnet restore ImmichDesktopUploader.sln --nologo

      - name: Build Release (including WinUI)
        run: dotnet build ImmichDesktopUploader.sln --configuration Release --no-restore --nologo

      # This is a console test runner, not a dotnet test project.
      - name: Run isolated tests
        run: ./scripts/Test-CI.ps1

      - name: Report test outcome
        if: ${{ always() }}
        run: |
          if (Test-Path TestResults/summary.md) {
            Get-Content TestResults/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            'Tests did not complete: see checkout, SDK, restore, build, and test step logs. No successful test result is available.' | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
